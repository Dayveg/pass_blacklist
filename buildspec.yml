version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt pytest
  pre_build:
    commands:
      - pytest tests/ -v
  build:
    commands:
      - echo "Compilacion y pruebas unitarias finalizadas exitosamente"

artifacts:
  files:
    - application.py
    - config.py
    - requirements.txt
    - Procfile
    - buildspec.yml
    - models/**/*
    - views/**/*
    - .ebextensions/**/*
  name: blacklist-microservice-artifact.zip
