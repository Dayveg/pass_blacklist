version: 0.2

env:
  variables:
    PYTHONPATH: "."

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "==> Instalando dependencias del microservicio y suite de pruebas..."
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pytest pytest-cov

  pre_build:
    commands:
      - echo "==> Ejecutando suite de pruebas unitarias automatizadas con pytest..."
      - pytest tests/ -v --junitxml=test-results.xml

  build:
    commands:
      - echo "==> Pruebas superadas con exito. Preparando artefacto de despliegue..."
      - echo "==> Fecha y commit: $(date)"

  post_build:
    commands:
      - echo "==> Proceso de Integracion Continua (CI) completado exitosamente."

artifacts:
  files:
    - application.py
    - config.py
    - requirements.txt
    - Procfile
    - buildspec.yml
    - models/**/*
    - views/**/*
    - .ebextensions/**/*
  name: blacklist-microservice-artifact.zip

reports:
  pytest_reports:
    files:
      - test-results.xml
    base-directory: .
    file-format: JUNITXML
